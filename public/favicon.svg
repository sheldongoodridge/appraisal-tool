<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Navy background square with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#13294B"/>
  <!-- Wheel icon scaled to 32×32, centered at (16,16), radius 12 -->
  <circle cx="16" cy="16" r="12" stroke="#D6A319" stroke-width="1.4" fill="none"/>
  <!-- 6 spokes -->
  <line x1="16" y1="16" x2="16"   y2="4"    stroke="#D6A319" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="26.4" y2="10"   stroke="#D6A319" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="26.4" y2="22"   stroke="#D6A319" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="16"   y2="28"   stroke="#D6A319" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="5.6"  y2="22"   stroke="#D6A319" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="5.6"  y2="10"   stroke="#D6A319" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Hub -->
  <circle cx="16" cy="16" r="2.5" fill="#D6A319"/>
</svg>
